name: Adaptia Build Engine

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruksi build, tuning, atau upgrade Adaptia"
        required: true
        type: string
      mode:
        description: "preview hanya melihat patch; apply commit ke branch; deploy commit lalu deploy Cloudflare"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - deploy

permissions:
  contents: write

concurrency:
  group: adaptia-build-engine-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned tooling
        run: npm ci --ignore-scripts

      - name: Generate and validate patch
        env:
          ADAPTIA_BUILD_PROMPT: ${{ inputs.prompt }}
          ADAPTIA_BUILD_MODE: ${{ inputs.mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_KEY: ${{ secrets.GEMINI_FALLBACK_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/adaptia-build-engine.mjs

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptia-build-report-${{ github.run_id }}
          path: .adaptia-build/
          if-no-files-found: ignore
