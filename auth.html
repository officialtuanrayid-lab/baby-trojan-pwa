<!DOCTYPE html>
<html lang="id" style="background:#0a0a0f">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Adaptia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;
min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:340px;width:100%;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;
background:linear-gradient(135deg,#00d4aa,#7c3aed);display:flex;align-items:center;justify-content:center;
font-size:32px;border:2.5px solid #00d4aa;box-shadow:0 0 24px rgba(0,212,170,0.4);
animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 24px rgba(0,212,170,0.3)}50%{box-shadow:0 0 40px rgba(0,212,170,0.6)}}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#6b7280;margin-bottom:28px}
.input-wrap{position:relative;margin-bottom:16px}
input{width:100%;background:rgba(10,10,15,0.7);border:1.5px solid rgba(0,212,170,0.35);
border-radius:14px;padding:14px 48px 14px 16px;color:#fff;font-size:15px;outline:none;
backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color 0.2s}
input:focus{border-color:#00d4aa}
input::placeholder{color:#4b5563}
.toggle-vis{position:absolute;right:14px;top:50%;transform:translateY(-50%);
background:none;border:none;color:#6b7280;cursor:pointer;padding:4px;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:600;
cursor:pointer;background:linear-gradient(135deg,#00d4aa,#7c3aed);color:#fff;
box-shadow:0 4px 16px rgba(0,212,170,0.3);transition:all 0.2s}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.error{color:#f87171;font-size:13px;margin-top:12px;display:none}
.footer{margin-top:32px;font-size:11px;color:#374151}
</style>
</head>
<body>
<div class="card">
  <div class="avatar">🤖</div>
  <h1>Adaptia</h1>
  <p class="sub">Masukkan password untuk melanjutkan</p>
  <form id="authForm">
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="Password" autocomplete="current-password" required>
      <button type="button" class="toggle-vis" onclick="toggleVis()">👁</button>
    </div>
    <button type="submit" class="btn" id="submitBtn">Masuk</button>
  </form>
  <p class="error" id="error">Password salah, coba lagi 😅</p>
  <p class="footer">🔒 Enkripsi end-to-end</p>
</div>
<script>
function toggleVis(){const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password'}
document.getElementById('authForm').addEventListener('submit',async function(e){
  e.preventDefault();
  const pwd=document.getElementById('pwd').value;
  const btn=document.getElementById('submitBtn');
  const err=document.getElementById('error');
  btn.disabled=true;btn.textContent='Memverifikasi...';
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:pwd})});
    const d=await r.json();
    if(d.ok){window.location.href='/'}
    else{err.style.display='block';btn.disabled=false;btn.textContent='Masuk'}
  }catch(ex){err.textContent='Koneksi error, coba lagi';err.style.display='block';btn.disabled=false;btn.textContent='Masuk'}
});
</script>
</body>
</html>
